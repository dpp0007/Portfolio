name: Project screenshots

# Captures fresh screenshots of every live project (image: "auto" in data.js)
# whenever data.js changes, weekly, or on demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths: ["assets/js/data.js"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Capture
        run: node tools/screenshots.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/shots
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update project screenshots" && git push)
